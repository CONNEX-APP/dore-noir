<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Caisse">
<title>Caisse Ti-Coq</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<style>
:root{--rouge:#D7262B;--jaune:#F5B82E;--charbon:#111316;--fumee:#1E2125;--ligne:#2C3036;--mut:#9AA0A8;--vert:#2FA463}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--charbon);color:#fff;font:16px/1.4 -apple-system,system-ui,Inter,sans-serif;overflow:hidden}
.hide{display:none!important}
#frame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:var(--charbon)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--charbon);z-index:20}
.box{width:100%;max-width:460px}
.logo{font-weight:800;font-size:34px;letter-spacing:.5px;margin-bottom:6px}.logo span{color:var(--rouge)}
.sub{color:var(--mut);font-size:15px;margin-bottom:18px}
.btn{appearance:none;border:0;border-radius:26px;padding:14px 22px;font:700 16px -apple-system,system-ui,sans-serif;color:#fff;background:var(--rouge);cursor:pointer}
.btn.sec{background:transparent;border:1.5px solid #fff}
.btn.big{width:100%;padding:18px;font-size:19px;margin-top:14px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stores button{appearance:none;border:1.5px solid var(--ligne);background:var(--fumee);color:#fff;border-radius:14px;padding:16px 10px;font:700 16px -apple-system,sans-serif}
.stores button.on{border-color:var(--rouge);background:#3a1416}
input{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--ligne);background:#0c0d0f;color:#fff;font-size:22px;text-align:center;letter-spacing:6px}
.err{color:#ff8a8d;font-weight:700;margin-top:10px;min-height:22px}
#start .box{text-align:center}
#start .tap{font-size:84px;line-height:1;margin:10px 0}
#alarm{position:fixed;inset:0;z-index:30;background:#b3151a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:flash 1s steps(2) infinite}
@keyframes flash{50%{background:#6e0b0e}}
#alarm .t{font-size:30px;font-weight:800;letter-spacing:1px;opacity:.9}
#alarm .m{font-size:46px;font-weight:800;line-height:1.15;margin:22px 0}
#alarm .m div{margin:10px 0}
#alarm .btn{background:#fff;color:#b3151a;font-size:22px;padding:20px 34px;border-radius:40px}
#alarm .h{margin-top:16px;font-size:15px;opacity:.85}
#dot{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;width:38px;height:38px;border-radius:50%;background:rgba(30,33,37,.85);border:1px solid var(--ligne);display:grid;place-items:center;font-size:18px;opacity:.55}
#dot.warn{background:#7a1a1d;opacity:.95}
#menu{position:fixed;right:10px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:11;background:var(--fumee);border:1px solid var(--ligne);border-radius:16px;padding:14px;width:310px;font-size:14px}
#menu .btn{width:100%;margin-top:8px;padding:11px;font-size:14px}
#menu .ln{margin:4px 0;color:#ddd}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000;border:1px solid var(--ligne);padding:12px 18px;border-radius:14px;z-index:40;max-width:90%}
</style>
</head>
<body>
<iframe id="frame" class="hide" allow="autoplay; clipboard-write" title="Caisse Ti-Coq"></iframe>

<div id="pair" class="screen hide"><div class="box">
  <div class="logo">Ti-Coq <span>Caisse</span></div>
  <div class="sub">Jumeler cet iPad : choisis la succursale et entre le code de la caisse.</div>
  <div class="stores" id="stores"></div>
  <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Code">
  <button class="btn big" id="pairBtn">Jumeler</button>
  <div class="err" id="pairErr"></div>
</div></div>

<div id="start" class="screen hide"><div class="box">
  <div class="logo">Ti-Coq <span>Caisse</span></div>
  <div class="tap">👆</div>
  <div style="font-size:24px;font-weight:800">Touche l'écran pour démarrer</div>
  <div class="sub" id="startSub" style="margin-top:8px">Les alarmes de la caisse (son et notifications) s'activent.</div>
</div></div>

<div id="alarm" class="hide">
  <div class="t">⏰ CAISSE</div>
  <div class="m" id="alarmMsg"></div>
  <button class="btn" id="alarmOk">OK, je m'en occupe</button>
  <div class="h">L'alarme revient dans 3 minutes tant que ce n'est pas fait sur l'iPad Caisse.</div>
</div>

<div id="dot" class="hide">🔔</div>
<div id="menu" class="hide"></div>
<div id="toast" class="hide"></div>
<script src="app.js?v=1.0.0"></script>
</body>
</html>
